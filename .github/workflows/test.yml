name: tests

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  schedule:
    - cron: "0 4 * * MON"
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }} / RDKit ${{ matrix.rdkit-version }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python-version: "3.11"
            rdkit-version: "2024.9.*"
          - os: ubuntu-latest
            python-version: "3.12"
            rdkit-version: "2025.3.*"
          - os: ubuntu-latest
            python-version: "3.13"
            rdkit-version: "2025.9.*"
          - os: ubuntu-latest
            python-version: "3.14"
            rdkit-version: "2026.3.*"
          - os: macos-latest
            python-version: "3.13"
            rdkit-version: "2026.3.*"
          - os: macos-15-intel
            python-version: "3.13"
            rdkit-version: "2025.9.*"
          - os: windows-latest
            python-version: "3.13"
            rdkit-version: "2026.3.*"

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up uv and Python
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.8"
          python-version: ${{ matrix.python-version }}
          activate-environment: true
          enable-cache: true

      - name: Install dependencies
        run: |
          uv pip install "rdkit==${{ matrix.rdkit-version }}"
          uv pip install --editable ".[test]"

      - name: Run core tests
        run: python -m pytest -m "not integration"

      - name: Test CLI
        run: medchem --help

      - name: Upload coverage
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.14'
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7
        with:
          files: coverage.xml
          fail_ci_if_error: false
          flags: unittests

  lilly:
    name: Lilly 2.1 / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, macos-15-intel]

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up uv and Python
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.8"
          python-version: "3.13"
          activate-environment: true
          enable-cache: true

      - name: Install Python dependencies
        run: uv pip install --editable ".[test]"

      - name: Install Linux build toolchain
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes g++ make ruby zlib1g-dev

      - name: Build and validate Lilly MedChem Rules 2.1
        run: medchem install-lilly

      - name: Run Lilly integration tests with wrapper coverage
        if: runner.os == 'Linux'
        run: |
          python -m coverage run --rcfile=.coveragerc-lilly -m pytest tests/test_structural.py -o addopts=""
          python -m coverage report --rcfile=.coveragerc-lilly --include="*/lilly_demerits/_demerits.py,*/lilly_demerits/_lilly.py" --show-missing --fail-under=85
          python -m coverage xml --rcfile=.coveragerc-lilly --include="*/lilly_demerits/_demerits.py,*/lilly_demerits/_lilly.py"

      - name: Upload Lilly wrapper coverage
        if: runner.os == 'Linux'
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7
        with:
          files: coverage-lilly.xml
          fail_ci_if_error: false
          flags: lilly

      - name: Run Lilly integration tests on macOS
        if: runner.os == 'macOS'
        run: python -m pytest -m "integration and lilly" --no-cov -n 0

  notebooks:
    name: Tutorial notebooks
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up uv and Python
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.8"
          python-version: "3.14"
          activate-environment: true
          enable-cache: true

      - name: Install dependencies
        run: uv pip install --editable ".[test]"

      - name: Run tutorial notebooks
        run: python -m pytest -m "integration and notebook" --no-cov -n 0
