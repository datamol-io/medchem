name: tests

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  schedule:
    - cron: "0 4 * * MON"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }} / RDKit ${{ matrix.rdkit-version }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python-version: "3.11"
            rdkit-version: "2024.9.*"
          - os: ubuntu-latest
            python-version: "3.12"
            rdkit-version: "2025.3.*"
          - os: ubuntu-latest
            python-version: "3.13"
            rdkit-version: "2025.9.*"
          - os: ubuntu-latest
            python-version: "3.14"
            rdkit-version: "2026.3.*"
          - os: macos-latest
            python-version: "3.13"
            rdkit-version: "2026.3.*"
          - os: macos-15-intel
            python-version: "3.13"
            rdkit-version: "2026.3.*"
          - os: windows-latest
            python-version: "3.13"
            rdkit-version: "2026.3.*"

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up uv and Python
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.8"
          python-version: ${{ matrix.python-version }}
          activate-environment: true
          enable-cache: true

      - name: Install dependencies
        run: |
          uv pip install "rdkit==${{ matrix.rdkit-version }}"
          uv pip install --editable ".[test]"

      - name: Run core tests
        run: python -m pytest -m "not integration"

      - name: Test CLI
        run: medchem --help

      - name: Upload coverage
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.14'
        uses: codecov/codecov-action@a99c28d3f0da835de33ff2feb2e15691c7b9641f # v7
        with:
          files: coverage.xml
          fail_ci_if_error: false
          flags: unittests

  lilly:
    name: Lilly 2.1 / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, macos-15-intel, windows-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up uv and Python
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.8"
          python-version: "3.13"
          activate-environment: true
          enable-cache: true

      - name: Install Python dependencies
        run: uv pip install --editable ".[test]"

      - name: Install Linux build toolchain
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes g++ make ruby zlib1g-dev

      - name: Install Windows build toolchain
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@66cd2cce69caa17b53920067426061ca1de3a884 # v2
        with:
          msystem: MSYS
          update: true
          path-type: inherit
          install: >-
            diffutils
            gcc
            make
            ruby
            zlib-devel

      - name: Build and validate Lilly MedChem Rules 2.1
        if: runner.os != 'Windows'
        run: medchem install-lilly

      - name: Build and validate Lilly MedChem Rules 2.1 on Windows
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: python -m medchem.cli install-lilly

      - name: Run Lilly integration tests with wrapper coverage
        if: runner.os == 'Linux'
        run: >-
          python -m pytest tests/test_structural.py
          -o addopts=""
          --cov=medchem.structural.lilly_demerits._demerits
          --cov=medchem.structural.lilly_demerits._lilly
          --cov-config=.coveragerc-lilly
          --cov-report=term-missing
          --cov-report=xml
          --cov-fail-under=85

      - name: Upload Lilly wrapper coverage
        if: runner.os == 'Linux'
        uses: codecov/codecov-action@a99c28d3f0da835de33ff2feb2e15691c7b9641f # v7
        with:
          files: coverage-lilly.xml
          fail_ci_if_error: false
          flags: lilly

      - name: Run Lilly integration tests on macOS
        if: runner.os == 'macOS'
        run: python -m pytest -m "integration and lilly" --no-cov -n 0

      - name: Run Lilly integration tests on Windows
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: python -m pytest -m "integration and lilly" --no-cov -n 0

  notebooks:
    name: Tutorial notebooks
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up uv and Python
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.8"
          python-version: "3.14"
          activate-environment: true
          enable-cache: true

      - name: Install dependencies
        run: uv pip install --editable ".[test]"

      - name: Run tutorial notebooks
        run: python -m pytest -m "integration and notebook" --no-cov -n 0
