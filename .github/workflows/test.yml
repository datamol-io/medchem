name: tests

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  schedule:
    - cron: "0 4 * * MON"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }} / RDKit ${{ matrix.rdkit-version }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python-version: "3.11"
            rdkit-version: "2024.9.*"
          - os: ubuntu-latest
            python-version: "3.12"
            rdkit-version: "2025.3.*"
          - os: ubuntu-latest
            python-version: "3.13"
            rdkit-version: "2025.9.*"
          - os: ubuntu-latest
            python-version: "3.14"
            rdkit-version: "2026.3.*"
          - os: macos-latest
            python-version: "3.13"
            rdkit-version: "2026.3.*"
          - os: windows-latest
            python-version: "3.13"
            rdkit-version: "2026.3.*"

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "rdkit==${{ matrix.rdkit-version }}"
          python -m pip install --editable ".[test]"

      - name: Run core tests
        run: python -m pytest --ignore=tests/test_notebooks.py -m "not lilly"

      - name: Test CLI
        run: medchem --help

      - name: Upload coverage
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.14'
        uses: codecov/codecov-action@v7
        with:
          files: coverage.xml
          fail_ci_if_error: false
          flags: unittests

  lilly-and-notebooks:
    name: Lilly integration and tutorial notebooks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: bash -el {0}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up the Lilly tools
        uses: mamba-org/setup-micromamba@v2
        with:
          environment-name: medchem
          create-args: >-
            python=3.14
            pip
            lilly-medchem-rules
          cache-environment: true
          cache-downloads: true

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --editable ".[test]"

      - name: Run Lilly integration tests
        run: python -m pytest -m lilly --ignore=tests/test_notebooks.py --no-cov -n 0

      - name: Run tutorial notebooks
        run: python -m pytest tests/test_notebooks.py --no-cov -n 0
