[build-system]
requires = ["setuptools>=77", "setuptools-scm>=8"]
build-backend = "setuptools.build_meta"

[tool.uv]
required-version = ">=0.12.8"

[project]
name = "medchem"
description = "Medchem: Molecular filtering for drug discovery."
dynamic = ["version"]
license = "Apache-2.0"
license-files = ["LICENSE.md", "medchem/data/LILLY_NOTICE"]
authors = [
    { name = "Emmanuel Noutahi", email = "emmanuel@valencediscovery.com" },
    { name = "Hadrien Mary", email = "hadrien@valencediscovery.com" },
]
readme = "README.md"
requires-python = ">=3.11"
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: Healthcare Industry",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
    "Natural Language :: English",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "datamol>=0.12.5",
    "fsspec>=2023.9.2",
    "lark>=1.2",
    "loguru>=0.7",
    "networkx>=3.2",
    "numpy>=1.26",
    "pandas>=2.2",
    "rdkit>=2024.9.1",
    "typer>=0.16",
]

[project.optional-dependencies]
test = [
    "ipykernel>=6.29",
    "nbconvert>=7.16",
    "nbformat>=5.10",
    "pyarrow>=15",
    "pytest>=8",
    "pytest-cov>=6",
    "pytest-xdist>=3.6",
]
docs = [
    "markdown-include>=0.8.1",
    "mike>=2",
    "mkdocs>=1.6",
    "mkdocs-click>=0.8",
    "mkdocs-jupyter>=0.25",
    "mkdocs-material>=9.5",
    "mkdocs-material-extensions>=1.3",
    "mkdocstrings[python]>=0.30",
]
dev = [
    "black>=25",
    "build>=1.2",
    "pre-commit>=4",
    "ruff>=0.11",
    "twine>=6",
]

[project.scripts]
medchem = "medchem.cli:app"

[project.urls]
"Source Code" = "https://github.com/datamol-io/medchem"
"Bug Tracker" = "https://github.com/datamol-io/medchem/issues"
Documentation = "https://medchem-docs.datamol.io/"

[tool.setuptools]
include-package-data = true

[tool.setuptools_scm]
fallback_version = "0.0.0"

[tool.setuptools.packages.find]
where = ["."]
include = ["medchem", "medchem.*"]
exclude = []
namespaces = true

[tool.setuptools.package-data]
"medchem.data" = ["*.csv", "*.lark"]
"medchem.data.charge_assigner" = ["*"]
"medchem.data.complexity" = ["*.csv"]
"medchem.data.queries" = ["*"]

[tool.setuptools.exclude-package-data]
"*" = ["__pycache__/*", "*.py[cod]"]

[tool.black]
line-length = 110
target-version = ['py311']
include = '\.pyi?$'

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "--verbose --durations=10 -n auto --cov=medchem --cov-fail-under=90 --cov-report xml --cov-report term"
testpaths = ["tests"]
markers = [
    "integration: runs optional external tools and executable tutorials",
    "lilly: requires the optional Lilly MedChem Rules command-line tools",
    "notebook: executes a tutorial notebook",
]
filterwarnings = ["ignore::DeprecationWarning:jupyter_client"]

[tool.coverage.run]
source = ["medchem/"]
disable_warnings = ["no-data-collected"]
data_file = ".coverage/coverage"

[tool.coverage.report]
omit = [
    "medchem/__init__.py",
    "medchem/_version.py",
    "medchem/structural/lilly_demerits/*",
]

[tool.coverage.xml]
output = "coverage.xml"

[tool.ruff]
line-length = 110
target-version = "py311"
extend-exclude = ["*.ipynb"]  # Exclude Jupyter notebooks

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
ignore = [
    "E501", # Never enforce `E501` (line length violations).
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = [
    "F401", # imported but unused
    "E402", # Module level import not at top of file
]

[tool.ruff.lint.pycodestyle]
max-doc-length = 150
